services:
  postgres:
    image: postgres:16-alpine
    container_name: bu-techno-postgres
    environment:
      POSTGRES_DB: bu_techno
      POSTGRES_USER: bu_techno
      POSTGRES_PASSWORD: bu_techno
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bu_techno -d bu_techno"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      DATABASE_URL: postgresql://bu_techno:bu_techno@postgres:5432/bu_techno?schema=public
      AUTH_SECRET: replace-with-a-strong-secret
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: replace-with-google-maps-api-key
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
